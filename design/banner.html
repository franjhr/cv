<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 1584px; height: 396px;
    background: #0E7C7B;
    overflow: hidden;
  }
  .banner {
    position: relative;
    width: 1584px; height: 396px;
    background: #0E7C7B;
  }
  .line {
    position: absolute;
    left: 470px; top: 50%;
    transform: translateY(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    color: #EAF7F6;
    white-space: nowrap;
  }
  .prompt { color: #7FD8D2; margin-right: 14px; }
  .str { color: #FFD9A0; }
</style>
</head>
<body>
  <div class="banner">
    <div class="line"><span class="prompt">$</span>ruby -e 'puts <span class="str">"backend dev exploring AI"</span>'</div>
  </div>
</body>
</html>
