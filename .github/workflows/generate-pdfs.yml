name: Regenerate CV PDFs

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Generate PDFs
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: bash scripts/generate_pdfs.sh

      - name: Commit updated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CV_Francisco_Hidalgo_Ruiz_es.pdf CV_Francisco_Hidalgo_Ruiz_en.pdf
          git diff --staged --quiet || git commit -m "Auto-regenerate CV PDFs [skip ci]"
          git push
